# Fly.io deployment for the Quant OS backend (API + engine loops).
# One machine only: the kill switch, order intents and account lock live in SQLite on the volume,
# so every process must share the same database file.
app = "quantos-api"
primary_region = "iad" # close to Alpaca's API (US East)

[build]
  dockerfile = "Dockerfile.railway"

[env]
  QOS_ENV = "production"
  QOS_DATA_DIR = "/data"
  # Hard stop for every broker order until paper trading is approved.
  # Remove this line (or set it to 0) only after that approval.
  QOS_KILL_SWITCH = "1"

# Persistent disk for the SQLite databases. Without it the kill switch and order records are lost
# on every deploy.
[mounts]
  source = "quantos_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off" # the engine loops must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
