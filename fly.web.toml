# Fly.io deployment for the Quant OS dashboard (static site). The API is the separate app quantos-api.
app = "quantos-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
